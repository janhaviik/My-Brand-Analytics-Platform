<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whos Studio dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2748;--bg:#fff2f7;--pink:#ff9ebb;--butter:#ffd966;--mint:#9be3c0;--lav:#c7b3f7;--white:#fff}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);background-image:radial-gradient(#ffd0e0 1.4px,transparent 1.6px);background-size:22px 22px}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 40px}
h1,h2,.num{font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:600;margin:0}
h1{font-size:clamp(40px,8vw,68px);line-height:1}
h2{font-size:22px;margin-bottom:12px}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.sub{margin:8px 0 0;max-width:46ch}
.badge{display:inline-block;vertical-align:middle;margin-left:10px;padding:4px 12px;background:var(--butter);border:2.5px solid var(--ink);border-radius:8px;font:500 15px Fredoka,sans-serif;transform:rotate(-4deg)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font:600 15px Figtree,sans-serif;color:var(--ink);background:var(--white);border:2.5px solid var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--white)}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.chip{border:2.5px solid var(--ink);padding:16px 18px;box-shadow:5px 5px 0 var(--ink)}
.chip .num{display:block;font-size:34px;line-height:1.1}
.chip:nth-child(1){background:var(--pink);border-radius:30px 30px 30px 8px}
.chip:nth-child(2){background:var(--mint);border-radius:30px 8px 30px 30px}
.chip:nth-child(3){background:var(--butter);border-radius:8px 30px 30px 30px}
.chip:nth-child(4){background:var(--lav);border-radius:30px 30px 8px 30px}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-bottom:20px}
.card{background:var(--white);border:2.5px solid var(--ink);padding:20px 22px}
.c-chart{border-radius:28px;box-shadow:6px 6px 0 var(--pink)}
.c-funnel{border-radius:12px 28px 12px 28px;box-shadow:6px 6px 0 var(--mint)}
.c-prod{border-radius:28px 12px 28px 12px;box-shadow:6px 6px 0 var(--lav)}
.note{background:var(--butter);border:2.5px solid var(--ink);border-radius:6px;padding:22px;transform:rotate(1.5deg);box-shadow:5px 5px 0 var(--ink)}
.note ul{margin:0;padding-left:20px}.note li{margin-bottom:8px}
.bars{display:flex;align-items:flex-end;gap:6px;height:210px;margin-top:6px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font:600 12px Figtree,sans-serif}
.bar i{display:block;width:100%;height:var(--h);background:var(--pink);border:2.5px solid var(--ink);border-radius:12px 12px 4px 4px;transform-origin:bottom;animation:grow .55s ease-out both}
.bar:hover i,.bar:focus-visible i,.bar.on i{background:var(--butter)}
@keyframes grow{from{transform:scaleY(0)}}
.read{margin:12px 0 0;font-weight:600}
.stage{border:2.5px solid var(--ink);border-radius:999px;padding:8px 16px;display:flex;justify-content:space-between;gap:10px;font-weight:600}
.stage:nth-of-type(1){background:var(--lav)}.stage:nth-of-type(2){background:var(--pink)}.stage:nth-of-type(3){background:var(--butter)}.stage:nth-of-type(4){background:var(--mint)}
.pct{margin:3px 0 3px 16px;font-size:13px}
.prod{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:2px dashed #e5d3e6}
.prod:first-of-type{border-top:0}
.thumb{width:54px;height:54px;border-radius:50%;border:2.5px solid var(--ink);background:var(--bg);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.prod b{display:block}.prod small{font-size:14px}.prod .tot{margin-left:auto;font-weight:600}
h3{font:600 15px Figtree,sans-serif;margin:14px 0 4px}
.hrow{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.track{height:16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden}
.fill{display:block;height:100%;background:var(--pink)}
.hrow span:last-child{text-align:right;font-weight:600}
h2.big{font-size:30px;margin:10px 0 6px}
.lead{margin:0 0 16px;max-width:60ch}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.step{background:var(--white);border:2.5px solid var(--ink);padding:18px 22px}
.step:nth-child(1){border-radius:28px 12px 28px 12px;box-shadow:6px 6px 0 var(--pink)}
.step:nth-child(2){border-radius:12px 28px 12px 28px;box-shadow:6px 6px 0 var(--mint)}
.step:nth-child(3){border-radius:12px 28px 12px 28px;box-shadow:6px 6px 0 var(--lav)}
.step:nth-child(4){border-radius:28px 12px 28px 12px;box-shadow:6px 6px 0 var(--butter)}
.step:nth-child(n+5){border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
.step:last-child:nth-child(odd){grid-column:1/-1}
.step h3{font:600 20px Fredoka,"Trebuchet MS",sans-serif;margin:0 0 8px}
.step p{margin:6px 0;font-size:15px}
footer{margin-top:26px;font-size:14px;max-width:70ch}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.note{transform:none}}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.bar i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Whos Studio<span class="badge" id="badge" hidden>sample data</span></h1>
      <p class="sub" id="sub">How the shop is doing: orders, revenue and how Instagram turns into sales.</p>
    </div>
    <div class="seg" role="group" aria-label="Time range">
      <button data-n="3" aria-pressed="false">Last 3 months</button>
      <button data-n="6" aria-pressed="false">Last 6 months</button>
      <button data-n="12" aria-pressed="true">Last 12 months</button>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Key numbers"></section>

  <div class="grid">
    <section class="card c-chart">
      <h2 id="t-chart">Revenue by month</h2>
      <div class="bars" id="bars"></div>
      <p class="read" id="read" aria-live="polite"></p>
    </section>
    <section class="card c-funnel">
      <h2>From scroll to order</h2>
      <div id="funnel"></div>
    </section>
  </div>

  <div class="grid">
    <section class="card c-prod">
      <h2 id="t-prod">Top products</h2>
      <div id="prods"></div>
    </section>
    <aside class="note">
      <h2>What the numbers taught me</h2>
      <ul id="notes"></ul>
    </aside>
  </div>

  <section id="next" hidden>
    <h2 class="big">What I'll try next</h2>
    <p class="lead">Ideas based on the numbers above. I'll check them against my next 90-day snapshot.</p>
    <div class="steps" id="steps"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
const D = window.STUDIO, cur = D.currency;
const fmt = n => Math.round(n).toLocaleString("en-IN");
const sum = (rows, k) => rows.reduce((a, r) => a + r[k], 0);
const $ = id => document.getElementById(id);
let span = 12;

function render() {
  const rows = D.months.slice(-span);
  const rev = sum(rows, "revenue"), ord = sum(rows, "orders"), rep = sum(rows, "repeat");

  $("kpis").innerHTML = [
    [cur + fmt(rev), "Revenue"],
    [fmt(ord), "Orders"],
    [cur + fmt(rev / ord), "Average order"],
    [Math.round(rep / ord * 100) + "%", "Orders from repeat buyers"]
  ].map(k => `<div class="chip"><span class="num">${k[0]}</span>${k[1]}</div>`).join("");

  // bar chart
  const max = Math.max(...rows.map(r => r.revenue));
  $("bars").innerHTML = rows.map((r, i) =>
    `<button class="bar" data-i="${i}" aria-label="${r.m}: ${cur}${fmt(r.revenue)} from ${r.orders} orders">
       <i style="--h:${r.revenue / max * 100}%"></i><span>${r.m}</span></button>`).join("");
  const best = rows.reduce((a, r) => r.revenue > a.revenue ? r : a);
  const show = r => $("read").textContent = `${r.m}: ${cur}${fmt(r.revenue)} from ${r.orders} orders`;
  show(best);
  document.querySelectorAll(".bar").forEach(b => {
    const go = () => { document.querySelectorAll(".bar").forEach(x => x.classList.remove("on")); b.classList.add("on"); show(rows[b.dataset.i]); };
    b.addEventListener("mouseenter", go); b.addEventListener("focus", go); b.addEventListener("click", go);
  });
  document.querySelector(`.bar[data-i="${rows.indexOf(best)}"]`).classList.add("on");

  // funnel (pill widths are decorative; the numbers and percentages are real)
  const st = [["Reached", sum(rows, "reach")], ["Visited the profile", sum(rows, "visits")],
              ["Sent a DM", sum(rows, "dms")], ["Placed an order", ord]];
  const widths = [100, 82, 64, 46];
  $("funnel").innerHTML = st.map((s, i) =>
    (i ? `<div class="pct">${(s[1] / st[i - 1][1] * 100).toFixed(1)}% of the step above</div>` : "") +
    `<div class="stage" style="width:${widths[i]}%"><span>${s[0]}</span><span>${fmt(s[1])}</span></div>`).join("");
}

function imgOrEmoji(p) {
  if (!p.img) return p.emoji;
  return `<img src="${p.img}" alt="${p.name}" onerror="this.replaceWith(document.createTextNode('${p.emoji}'))">`;
}

$("prods").innerHTML = D.products.map(p =>
  `<div class="prod"><div class="thumb">${imgOrEmoji(p)}</div>
   <div><b>${p.name}</b><small>${p.units} sold</small></div><span class="tot">${cur}${fmt(p.revenue)}</span></div>`).join("");
$("notes").innerHTML = D.notes.map(n => `<li>${n}</li>`).join("");
$("foot").textContent = (D.isSample ? "The numbers here are sample data until data/ holds your real exports. " : "") +
  "Built with plain HTML, CSS and JavaScript. Shop: " + D.site + ".";
$("badge").hidden = !D.isSample;

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  span = +b.dataset.n;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));

const kfmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(".0", "") + "K" : String(n);
function hbars(obj, fmtv, color) {
  const max = Math.max(...Object.values(obj));
  return Object.entries(obj).map(([k, v]) =>
    `<div class="hrow"><span>${k}</span><span class="track"><span class="fill" style="width:${v / max * 100}%;background:${color}"></span></span><span>${fmtv(v)}</span></div>`).join("");
}
function snap() {
  const S = D.snapshot, I = S.instagram, d = S.derived, A = S.audience;
  const approx = S.sales.approximate ? " (approx.)" : "";
  $("sub").textContent = "Instagram and sales snapshot, " + S.period.label + ".";
  document.querySelector(".seg").hidden = true;
  $("kpis").innerHTML = [
    [cur + fmt(S.sales.revenue), "Revenue" + approx],
    [fmt(S.sales.orders), "Orders"],
    [cur + fmt(d.avg_order), "Average order" + approx],
    [(d.order_rate * 100).toFixed(1) + "%", "Profile visits that became orders"]
  ].map(k => `<div class="chip"><span class="num">${k[0]}</span>${k[1]}</div>`).join("");

  $("t-chart").textContent = "Accounts reached, by content type";
  const bars = $("bars"); bars.className = ""; bars.style.height = "auto";
  bars.innerHTML = hbars(I.reach_by_type, kfmt, "var(--pink)");
  $("read").textContent = "Interactions: " + Object.entries(I.interactions_by_type).map(([k, v]) => k + " " + kfmt(v)).join(", ") +
    " (" + fmt(I.interactions) + " in total). " + I.net_followers + " net new followers, " + I.followers + " followers now.";

  const st = [["Viewers", I.viewers], ["Visited the profile", I.profile_visits], ["Placed an order", S.sales.orders]];
  $("funnel").innerHTML = st.map((s, i) =>
    (i ? `<div class="pct">${(s[1] / st[i - 1][1] * 100).toFixed(1)}% of the step above</div>` : "") +
    `<div class="stage" style="width:${[100, 70, 40][i]}%"><span>${s[0]}</span><span>${fmt(s[1])}</span></div>`).join("") +
    `<p class="pct">${fmt(I.bio_link_taps)} people also tapped the bio link.</p>`;

  $("t-prod").textContent = "Who follows the shop";
  $("prods").innerHTML = A ? "<h3>Gender</h3>" + hbars(A.gender, v => v + "%", "var(--lav)") +
    "<h3>Age</h3>" + hbars(A.age, v => v + "%", "var(--mint)") +
    "<h3>Top countries</h3>" + hbars(A.countries, v => v + "%", "var(--butter)") : "";
  $("foot").textContent = "Instagram figures come from Instagram Insights (" + S.period.days + " days). Orders and revenue are from my own records" +
    (S.sales.approximate ? " and are approximate" : "") + ". Shop: " + D.site + ".";
}
const steps = D.nextSteps || [];
$("next").hidden = !steps.length;
$("steps").innerHTML = steps.map(s =>
  `<article class="step"><h3>${s.title}</h3><p><b>What I see:</b> ${s.why}</p>` +
  `<p><b>What I'll try:</b> ${s.do}</p><p><b>How I'll know:</b> ${s.track}</p></article>`).join("");
D.snapshot ? snap() : render();
</script>
</body>
</html>
